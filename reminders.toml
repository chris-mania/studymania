# The small Worker that sends daily reminders every hour.
# Deploy with:  npx wrangler deploy -c reminders.toml
name = "studymania-reminders"
main = "src/reminders.js"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
crons = ["0 * * * *"]

# Same three values as wrangler.toml
[[d1_databases]]
binding = "DB"
database_name = "studymania"
